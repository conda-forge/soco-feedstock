schema_version: 1

context:
  version: "0.32.2"

package:
  name: soco
  version: ${{ version }}

source:
  url: https://pypi.org/packages/source/s/soco/soco-${{ version }}.tar.gz
  sha256: bd6b95215fa9c7b61158cb7025bcf0259516925af2abc666dbf8e20641be9a61

build:
  number: 0
  noarch: python
  script: ${{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation

requirements:
  host:
    - python ${{ python_min }}.*
    - pytest
    - pip
    - setuptools >=83.0.0
  run:
    - python >=${{ python_min }}
    - requests
    - xmltodict
    - ifaddr
    - appdirs
    - lxml

tests:
  - python:
      imports:
        - soco
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - "*"

about:
  summary: SoCo (Sonos Controller) is a simple library to control Sonos speakers.
  license: MIT
  license_file: LICENSE.rst
  homepage: https://github.com/SoCo/SoCo

extra:
  recipe-maintainers:
    - HeavyTony2
